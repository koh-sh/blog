name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install dependencies
        run: npm install

      - name: Run lint, type-check, and tests
        run: mise run ci

      - name: Setup Dart Sass
        uses: dw-labs-org/dart-sass-gha@d5c4c43545a79eaaa11cb4ec8363462702346184 # v1.0.1

      - name: Build Hugo site
        run: hugo --minify
